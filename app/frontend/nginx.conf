log_format triage '$time_iso8601 $request_method $uri $status $request_time';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout triage;
    error_log /dev/stderr warn;

    location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; }
    location = /health { proxy_pass http://backend:8000/health; proxy_set_header X-Request-ID $request_id; }
    location = /metrics { proxy_pass http://backend:8000/metrics; }
    location / { try_files $uri $uri/ /index.html; }
}

name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          docker buildx build --platform linux/amd64 --push \
            -f app/backend/Dockerfile \
            -t "$ECR_REGISTRY/taskflow-backend:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/taskflow-backend:latest" .
          docker buildx build --platform linux/amd64 --push \
            -f app/frontend/Dockerfile \
            -t "$ECR_REGISTRY/taskflow-frontend:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/taskflow-frontend:latest" .
      - name: Register task definitions and deploy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          for service in taskflow-backend taskflow-frontend; do
            current=$(aws ecs describe-services --cluster taskflow-cluster --services "$service" --query 'services[0].taskDefinition' --output text)
            aws ecs describe-task-definition --task-definition "$current" --query taskDefinition > "/tmp/$service.json"
            jq --arg image "$ECR_REGISTRY/$service:$IMAGE_TAG" '.containerDefinitions[0].image = $image | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
              "/tmp/$service.json" > "/tmp/$service-new.json"
            task_definition=$(aws ecs register-task-definition --cli-input-json "file:///tmp/$service-new.json" --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-service --cluster taskflow-cluster --service "$service" --task-definition "$task_definition" >/dev/null
          done
          aws ecs wait services-stable --cluster taskflow-cluster --services taskflow-backend taskflow-frontend
